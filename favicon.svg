<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e092"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </radialGradient>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bg-glow)" stroke="url(#gold-grad)" stroke-width="16"/>
  
  <!-- Subtle F1 / Spider-Man red accent dot -->
  <circle cx="410" cy="102" r="22" fill="#e10600"/>
  
  <!-- MA Logo Typography -->
  <text x="256" y="325" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="230" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="4">MA</text>
</svg>
